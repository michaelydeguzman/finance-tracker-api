name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore FinanceTracker/FinanceTracker.API.sln

      - name: Build
        run: dotnet build FinanceTracker/FinanceTracker.API.sln --no-restore

      # Integration tests swap SQL Server for EF Core InMemory (see
      # FinanceTrackerWebApplicationFactory), so the whole suite runs here with
      # no database and never touches real financial data.
      - name: Test
        run: dotnet test FinanceTracker/FinanceTracker.API.sln --no-build --verbosity normal
